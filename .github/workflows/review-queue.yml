# Daily check of the visitor review queues (video submissions + elevator
# reports). If anything is pending, it opens — or updates — a single issue
# titled "Review queue", which GitHub emails to Selin. When the queues are
# empty again, the issue closes itself. Uses only the public anon key.
name: review-queue
on:
  schedule:
    - cron: "0 13 * * *"   # daily 9am ET
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Count pending and sync the issue
        uses: actions/github-script@v7
        with:
          script: |
            const KEY = 'sb_publishable_SceOqu60uTDQpX_SM62gAQ_Rl5TgZig';
            const BASE = 'https://qrphiipxqvsrnenkphhr.supabase.co/rest/v1';
            const count = async table => {
              const r = await fetch(
                `${BASE}/${table}?select=id&status=eq.pending&limit=1`,
                { method: 'HEAD', headers: { apikey: KEY, Prefer: 'count=exact' } });
              return parseInt((r.headers.get('content-range') || '/0').split('/')[1], 10) || 0;
            };
            const videos = await count('submissions');
            const reports = await count('elevator_reports');
            const total = videos + reports;

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'review-queue',
            });
            const existing = open[0];

            if (total === 0) {
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number, state: 'closed',
                });
                console.log('queue empty — closed the issue');
              } else {
                console.log('queue empty — nothing to do');
              }
              return;
            }

            const body = [
              `The LiftSpot review queue has **${total} pending item${total === 1 ? '' : 's'}**:`,
              '',
              `- ${videos} video submission${videos === 1 ? '' : 's'}`,
              `- ${reports} elevator report${reports === 1 ? '' : 's'}`,
              '',
              'Review them with:',
              '```',
              'python3 scripts/review_submissions.py   # http://localhost:8898',
              'python3 scripts/review_submissions.py --sql',
              '```',
              `_Last checked ${new Date().toISOString().slice(0, 16)}Z — updates daily, closes itself when the queue is empty._`,
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, title: `Review queue: ${total} pending`, body,
              });
              console.log(`updated issue #${existing.number} (${total} pending)`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `Review queue: ${total} pending`, body, labels: ['review-queue'],
              });
              console.log(`opened a new issue (${total} pending)`);
            }
