<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<script>
  /* Apply the saved (or ?mode=) theme before first paint so there's no flash. */
  (function () {
    try {
      var u = new URLSearchParams(location.search).get('mode');
      var m = (u === 'full' || u === 'calm') ? u : (localStorage.getItem('liftspot_mode') || 'calm');
      document.documentElement.dataset.mode = m;
    } catch (e) { document.documentElement.dataset.mode = 'calm'; }
  })();
</script>
<title>LiftSpot</title>
<meta name="description" content="Find and rate elevators in buildings across Long Island, NY. Search hospitals, offices, malls, hotels and more." />
<meta property="og:title" content="LiftSpot — Find Elevators on Long Island" />
<meta property="og:description" content="Find and rate elevators in verified buildings across Long Island." />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#16211d" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316211d'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%23c9ced0' stroke-width='3'/%3E%3Cpath d='M32 18l8 10H24z' fill='%2323a47f'/%3E%3Cpath d='M32 46l-8-10h16z' fill='%2323a47f'/%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2316211d'/%3E%3Ccircle cx='32' cy='32' r='21' fill='none' stroke='%23c9ced0' stroke-width='3'/%3E%3Cpath d='M32 17l8 10H24z' fill='%2323a47f'/%3E%3Cpath d='M32 47l-8-10h16z' fill='%2323a47f'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body>
<a class="skip-link" href="#list">Skip to results</a>

<div class="app">
  <header class="topbar">
    <a class="brand" href="./" aria-label="LiftSpot home">
      <span class="mark" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><circle cx="32" cy="32" r="28" fill="#1d2b26"/><circle cx="32" cy="32" r="27" fill="none" stroke="#c9ced0" stroke-width="3"/><path d="M32 16l9 11H23z" fill="#23a47f"/><path d="M32 48l-9-11h18z" fill="#23a47f"/></svg></span>
      <h1>Lift<span class="up">Spot</span></h1>
    </a>

    <div class="search" id="searchWrap">
      <svg class="s-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
      <input id="q" type="search" role="combobox" aria-expanded="false" aria-controls="palette" aria-autocomplete="list"
        placeholder="Search buildings, towns, or places…" aria-label="Search buildings, towns, or places" autocomplete="off" />
      <span class="kbd" aria-hidden="true">⌘K</span>
      <button class="clear-btn" id="clearSearch" aria-label="Clear search">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M1 1l8 8M9 1l-8 8"/></svg>
      </button>
      <div class="palette" id="palette" role="listbox" aria-label="Search results"></div>
    </div>

    <button class="ctrl" id="locBtn" aria-pressed="false" aria-label="Show buildings near me">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      <span>Near me</span>
    </button>
    <button class="ctrl" id="resBtn" aria-expanded="false" aria-controls="resModal" aria-label="Elevator resources">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>
      <span>Resources</span>
    </button>
    <button class="ctrl" id="modeBtn" aria-pressed="false" aria-label="Turn on full detail view"
      title="Switch between the calm look and the full-detail look">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span>Full detail</span>
    </button>
    <button class="ctrl" id="voiceBtn" data-vstate="idle" aria-pressed="false" aria-label="Start talking to the elevator guide"
      title="Talk to the elevator guide out loud">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4"/><path d="M8 22h8"/></svg>
      <span class="v-label">Ask aloud</span>
    </button>
  </header>

  <aside class="rail" id="rail" aria-label="Filters and building list">
    <button class="sheet-handle" id="sheetHandle" aria-label="Expand results list"></button>

    <div class="cab" id="cab">
      <button class="cab-close" id="cabClose" aria-label="Close filters">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 2l12 12M14 2L2 14"/></svg>
      </button>
      <div class="plate">
        <div class="cab-label" id="plateLabel">Building type</div>
        <div class="plate-grid" id="typePlate" role="group" aria-labelledby="plateLabel"></div>
      </div>
      <div class="floors">
        <div class="cab-label" id="floorLabel">Stories</div>
        <div class="floor-mode" role="radiogroup" aria-label="Story filter mode">
          <button type="button" id="modeMin" role="radio" aria-checked="true">Min</button>
          <button type="button" id="modeExact" role="radio" aria-checked="false">Exact</button>
        </div>
        <select id="storySelect" class="story-select" aria-label="Minimum stories"></select>
      </div>
    </div>

    <div class="mode" id="modeChip">
      <span id="modeText"></span>
      <button class="x" id="modeClear">Clear</button>
    </div>

    <div class="radius" id="radiusRow">
      <label for="radiusRange">Within</label>
      <input type="range" id="radiusRange" min="1" max="25" value="5" step="1" aria-label="Search radius in miles" />
      <span class="val led" id="radiusVal">5 mi</span>
    </div>

    <div class="listwrap">
      <div class="readout" aria-live="polite">
        <span class="n led led-lit" id="countN">—</span>
        <span class="cap" id="countCap">buildings</span>
        <span class="sort" id="countSort"></span>
      </div>
      <div class="list" id="list" role="list" aria-label="Buildings" tabindex="-1"></div>
    </div>
  </aside>

  <main class="mapwrap" aria-label="Map of buildings">
    <div id="map"></div>
    <div class="map-shimmer" id="mapShimmer" aria-hidden="true"></div>
    <button class="filters-fab" id="filtersFab" aria-expanded="false" aria-controls="cab">
      <span class="dot" aria-hidden="true"></span>
      Filters
    </button>
  </main>
</div>

<div class="scrim" id="scrim" aria-hidden="true"></div>

<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true">
  <div class="dhead">
    <button class="close-btn" id="closeDrawer" aria-label="Close building details">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 2l12 12M14 2L2 14"/></svg>
    </button>
    <h2 id="drawerTitle"></h2>
    <div class="dtype" id="dType"></div>
    <div class="daddr" id="dAddr"></div>
  </div>
  <div class="datastrip" id="dataStrip" aria-label="Building data"></div>
  <div class="dbody" id="dBody"></div>
  <div class="doors" aria-hidden="true"><div class="door l"></div><div class="door r"></div></div>
</div>

<div class="scrim" id="resScrim" aria-hidden="true"></div>
<div class="resmodal" id="resModal" role="dialog" aria-modal="true" aria-labelledby="resTitle" aria-hidden="true">
  <div class="res-head">
    <h2 id="resTitle">Elevator resources</h2>
    <p>The wikis, forums, channels, and places the elevator community has built.</p>
    <button class="close-btn" id="resClose" aria-label="Close resources">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 2l12 12M14 2L2 14"/></svg>
    </button>
  </div>
  <div class="res-body" id="resBody"></div>
</div>

<!-- Voice agent overlay: "step into the cab." Calm, low-stimulation, with an
     LED status plate, a soft listening orb, live captions to read along, and a
     single clear button to end. Doors part on connect in full-detail mode. -->
<div class="voice-overlay" id="voiceOverlay" role="dialog" aria-modal="true" aria-labelledby="voiceHeading" aria-hidden="true">
  <div class="vc-cab" id="voiceCab" data-vstate="idle">
    <div class="vc-doors" aria-hidden="true"><span class="vc-door l"></span><span class="vc-door r"></span></div>

    <div class="vc-inner">
      <button class="vc-close" id="voiceClose" aria-label="Close and end the conversation">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 2l12 12M14 2L2 14"/></svg>
      </button>

      <h2 class="vc-heading" id="voiceHeading">Talking to the elevator guide</h2>

      <div class="vc-orb" aria-hidden="true">
        <span class="vc-ring"></span>
        <span class="vc-ring"></span>
        <span class="vc-core">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4"/><path d="M8 22h8"/></svg>
        </span>
      </div>

      <p class="vc-status" id="voiceStatusText">Connecting…</p>

      <div class="vc-caption" id="voiceCaption"></div>

      <button class="vc-end" id="voiceEnd">
        <span class="vc-end-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></span>
        <span>End conversation</span>
      </button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<!-- Spoken status for the voice agent, announced calmly to screen readers. -->
<div class="visually-hidden" id="voiceStatus" role="status" aria-live="polite"></div>

<script type="module" src="js/ui.js"></script>
</body>
</html>
