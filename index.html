<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>LiftSpot — Find Elevators on Long Island</title>
<meta name="description" content="Find and rate elevators in buildings across Long Island, NY. Search hospitals, offices, malls, hotels and more." />
<meta property="og:title" content="LiftSpot — Find Elevators on Long Island" />
<meta property="og:description" content="Find and rate elevators in 600+ buildings across Long Island." />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#16211d" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 160'%3E%3Cpath d='M60 0C33.49 0 12 21.49 12 48C12 76.5 60 140 60 140C60 140 108 76.5 108 48C108 21.49 86.51 0 60 0Z' fill='%231f6f5c'/%3E%3Ccircle cx='60' cy='42' r='24' fill='white'/%3E%3Crect x='44' y='30' width='14' height='24' rx='1' fill='%231f6f5c'/%3E%3Crect x='62' y='30' width='14' height='24' rx='1' fill='%231f6f5c'/%3E%3Cpath d='M60 34L54 40L66 40Z' fill='white'/%3E%3Cpath d='M60 50L66 44L54 44Z' fill='white'/%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 160'%3E%3Crect width='120' height='160' rx='28' fill='%231f6f5c'/%3E%3Cpath d='M60 10C39.49 10 22 27.49 22 50C22 73 60 120 60 120C60 120 98 73 98 50C98 27.49 80.51 10 60 10Z' fill='white'/%3E%3Ccircle cx='60' cy='44' r='16' fill='%231f6f5c'/%3E%3Crect x='50' y='36' width='8' height='16' rx='1' fill='white'/%3E%3Crect x='62' y='36' width='8' height='16' rx='1' fill='white'/%3E%3Cpath d='M60 38L56 43L64 43Z' fill='%231f6f5c'/%3E%3Cpath d='M60 50L64 45L56 45Z' fill='%231f6f5c'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body>
<a class="skip-link" href="#list">Skip to results</a>

<div class="app">
  <header class="topbar">
    <a class="brand" href="./" aria-label="LiftSpot home">
      <span class="mark" aria-hidden="true"><svg width="22" height="30" viewBox="0 0 120 160" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M60 0C33.49 0 12 21.49 12 48C12 76.5 60 140 60 140C60 140 108 76.5 108 48C108 21.49 86.51 0 60 0Z" fill="#23a47f"/><circle cx="60" cy="42" r="24" fill="#16211d"/><rect x="44" y="30" width="14" height="24" rx="1" fill="#23a47f"/><rect x="62" y="30" width="14" height="24" rx="1" fill="#23a47f"/><path d="M60 34L54 40L66 40Z" fill="#16211d"/><path d="M60 50L66 44L54 44Z" fill="#16211d"/></svg></span>
      <h1>Lift<span class="up">Spot</span></h1>
    </a>

    <div class="search" id="searchWrap">
      <svg class="s-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
      <input id="q" type="search" role="combobox" aria-expanded="false" aria-controls="palette" aria-autocomplete="list"
        placeholder="Search buildings, towns, or places…" aria-label="Search buildings, towns, or places" autocomplete="off" />
      <span class="kbd" aria-hidden="true">⌘K</span>
      <button class="clear-btn" id="clearSearch" aria-label="Clear search">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M1 1l8 8M9 1l-8 8"/></svg>
      </button>
      <div class="palette" id="palette" role="listbox" aria-label="Search results"></div>
    </div>

    <button class="nearme" id="locBtn" aria-pressed="false" aria-label="Near me">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      <span>Near me</span>
    </button>
  </header>

  <aside class="rail" id="rail" aria-label="Filters and building list">
    <button class="sheet-handle" id="sheetHandle" aria-label="Expand results list"></button>

    <div class="cab" id="cab">
      <button class="cab-close" id="cabClose" aria-label="Close filters">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 2l12 12M14 2L2 14"/></svg>
      </button>
      <div class="plate">
        <div class="cab-label" id="plateLabel">Building type</div>
        <div class="plate-grid" id="typePlate" role="group" aria-labelledby="plateLabel"></div>
      </div>
      <div class="floors">
        <div class="cab-label" id="floorLabel">Stories</div>
        <div class="floor-mode" role="radiogroup" aria-label="Story filter mode">
          <button type="button" id="modeMin" role="radio" aria-checked="true">Min</button>
          <button type="button" id="modeExact" role="radio" aria-checked="false">Exact</button>
        </div>
        <select id="storySelect" class="story-select" aria-label="Minimum stories"></select>
      </div>
    </div>

    <div class="mode" id="modeChip">
      <span id="modeText"></span>
      <button class="x" id="modeClear">Clear</button>
    </div>

    <div class="radius" id="radiusRow">
      <label for="radiusRange">Within</label>
      <input type="range" id="radiusRange" min="1" max="25" value="5" step="1" aria-label="Search radius in miles" />
      <span class="val led" id="radiusVal">5 mi</span>
    </div>

    <div class="listwrap">
      <div class="readout" aria-live="polite">
        <span class="n led led-lit" id="countN">—</span>
        <span class="cap" id="countCap">buildings</span>
        <span class="sort" id="countSort"></span>
      </div>
      <div class="list" id="list" role="list" aria-label="Buildings" tabindex="-1"></div>
    </div>
  </aside>

  <div class="mapwrap">
    <div id="map" role="region" aria-label="Map of buildings"></div>
    <div class="map-shimmer" id="mapShimmer" aria-hidden="true"></div>
    <button class="filters-fab" id="filtersFab" aria-expanded="false" aria-controls="cab">
      <span class="dot" aria-hidden="true"></span>
      Filters
    </button>
  </div>
</div>

<div class="scrim" id="scrim" aria-hidden="true"></div>

<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true">
  <div class="dhead">
    <button class="close-btn" id="closeDrawer" aria-label="Close building details">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 2l12 12M14 2L2 14"/></svg>
    </button>
    <h2 id="drawerTitle"></h2>
    <div class="dtype" id="dType"></div>
    <div class="daddr" id="dAddr"></div>
  </div>
  <div class="datastrip" id="dataStrip" aria-label="Building data"></div>
  <div class="dbody" id="dBody"></div>
  <div class="doors" aria-hidden="true"><div class="door l"></div><div class="door r"></div></div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script type="module" src="js/ui.js"></script>
</body>
</html>
