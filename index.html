<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LiftSpot — Find Elevators on Long Island</title>
<meta name="description" content="Find and rate elevators in buildings across Long Island, NY. Search hospitals, offices, malls, hotels and more." />
<meta property="og:title" content="LiftSpot — Find Elevators on Long Island" />
<meta property="og:description" content="Find and rate elevators in 600+ buildings across Long Island." />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#1f6f5c" />

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 160'%3E%3Crect width='120' height='160' rx='28' fill='%231f6f5c'/%3E%3Cpath d='M60 10C39.49 10 22 27.49 22 50C22 73 60 120 60 120C60 120 98 73 98 50C98 27.49 80.51 10 60 10Z' fill='white'/%3E%3Ccircle cx='60' cy='44' r='16' fill='%231f6f5c'/%3E%3Crect x='50' y='36' width='8' height='16' rx='1' fill='white'/%3E%3Crect x='62' y='36' width='8' height='16' rx='1' fill='white'/%3E%3Cpath d='M60 38L56 43L64 43Z' fill='%231f6f5c'/%3E%3Cpath d='M60 50L64 45L56 45Z' fill='%231f6f5c'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f4f1ea;
    --panel: #fffdf8;
    --ink: #1c2a28;
    --muted: #576260;
    --line: #e2ddd1;
    --accent: #1f6f5c;
    --accent-hover: #185c4c;
    --accent-soft: #dcefe7;
    --star: #b87d00;
    --shadow-sm: 0 1px 3px rgba(28,42,40,.07);
    --shadow: 0 2px 6px rgba(28,42,40,.06), 0 10px 28px rgba(28,42,40,.09);
    --radius: 12px;
    --ease: cubic-bezier(.4,0,.2,1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* ── Layout ── */
  .app { display: grid; grid-template-columns: 380px 1fr; height: 100vh; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 52vh 48vh; }
    #map { order: -1; }
  }

  /* ── Sidebar ── */
  .panel {
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    height: 100vh; overflow: hidden;
  }

  header.brand { padding: 20px 20px 14px; border-bottom: 1px solid var(--line); }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo .mark {
    width: 28px; height: 38px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .logo h1 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
  .tag { color: var(--muted); font-size: 13px; margin-top: 5px; line-height: 1.45; }

  /* ── Filters ── */
  .filters { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }

  .search { position: relative; }
  .search input {
    width: 100%; min-height: 44px;
    padding: 11px 36px 11px 36px;
    border: 1.5px solid var(--line); border-radius: var(--radius);
    background: #fff; font: inherit; font-size: 14px; color: var(--ink);
    transition: border-color 180ms var(--ease), box-shadow 180ms var(--ease);
  }
  .search input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .search input::placeholder { color: var(--muted); }
  .s-icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--muted); pointer-events: none;
  }
  .clear-btn {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px;
    border: none; background: var(--line); border-radius: 50%;
    cursor: pointer; color: var(--muted);
    display: none; place-items: center;
    transition: background 150ms var(--ease);
  }
  .clear-btn:hover { background: #cdc9be; }
  .search.has-value .clear-btn { display: grid; }

  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1.5px solid var(--line); background: #fff; border-radius: 999px;
    padding: 7px 14px; min-height: 36px;
    font: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer; user-select: none; white-space: nowrap;
    display: flex; align-items: center;
    transition: border-color 150ms var(--ease), background 150ms var(--ease), color 150ms var(--ease);
  }
  .chip:hover { border-color: var(--accent); background: var(--accent-soft); }
  .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }

  .range-row { display: flex; flex-direction: column; gap: 5px; }
  .range-row .range-header { display: flex; justify-content: space-between; align-items: center; }
  .range-row label { font-size: 12.5px; color: var(--muted); }
  .range-row label span { font-weight: 600; color: var(--ink); }
  .range-row input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; height: 20px; }
  .exact-toggle {
    border: 1.5px solid var(--line); background: #fff; border-radius: 999px;
    padding: 3px 10px; font: inherit; font-size: 11.5px; font-weight: 600;
    cursor: pointer; color: var(--muted);
    transition: background 150ms var(--ease), color 150ms var(--ease), border-color 150ms var(--ease);
  }
  .exact-toggle.on { background: var(--accent); color: #fff; border-color: var(--accent); }

  .locbtn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    border: 1.5px solid var(--accent); color: var(--accent); background: var(--accent-soft);
    border-radius: var(--radius); padding: 10px 14px; min-height: 44px; width: 100%;
    font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
    transition: background 180ms var(--ease), box-shadow 180ms var(--ease);
  }
  .locbtn:hover { background: #cae4db; box-shadow: 0 2px 10px rgba(31,111,92,.18); }

  /* ── List ── */
  .list { flex: 1; overflow-y: auto; padding: 6px 12px 32px; }
  .list::-webkit-scrollbar { width: 4px; }
  .list::-webkit-scrollbar-track { background: transparent; }
  .list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 99px; }
  .count { font-size: 12px; color: var(--muted); padding: 8px 4px 4px; letter-spacing: .01em; }

  /* ── Cards ── */
  .card {
    background: #fff; border: 1.5px solid var(--line); border-radius: var(--radius);
    padding: 16px; margin: 5px 0; cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform 180ms var(--ease), box-shadow 180ms var(--ease), border-color 180ms var(--ease);
  }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: #c4beb0; }
  .card:active { transform: translateY(0); }
  .card.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-sm); }
  .card .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .card h3 { font-size: 14.5px; font-weight: 600; line-height: 1.3; letter-spacing: -.01em; }
  .card .type { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; margin-top: 4px; display: flex; align-items: center; gap: 3px; }
  .card .addr { font-size: 12px; color: var(--muted); margin-top: 7px; line-height: 1.45; }
  .card .meta { display: flex; gap: 7px; align-items: center; margin-top: 10px; font-size: 11.5px; flex-wrap: wrap; }

  .badge { background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 3px 8px; font-weight: 600; font-size: 11.5px; white-space: nowrap; }
  .dist { color: var(--muted); }
  .stars { color: var(--star); letter-spacing: 1px; font-size: 13px; }
  .stars .n { color: var(--muted); margin-left: 3px; font-size: 12px; }

  /* ── Skeleton ── */
  .skeleton-card { background: #fff; border: 1.5px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin: 6px 0; }
  .skel {
    background: linear-gradient(90deg, var(--line) 25%, #eae6dd 50%, var(--line) 75%);
    background-size: 200% 100%; border-radius: 6px;
    animation: shimmer 1.5s infinite;
  }
  .skel-title { height: 16px; width: 68%; margin-bottom: 9px; }
  .skel-sub { height: 12px; width: 42%; margin-bottom: 10px; }
  .skel-addr { height: 11px; width: 82%; margin-bottom: 12px; }
  .skel-row { display: flex; gap: 8px; }
  .skel-badge { height: 22px; width: 72px; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* ── Map ── */
  #map { height: 100%; width: 100%; }
  @media (max-width: 860px) { #map { height: 52vh; } }
  .maplibregl-popup-content { font-family: 'Spline Sans', sans-serif; border-radius: 10px; padding: 10px 14px; font-size: 13.5px; }


  /* ── Drawer ── */
  .drawer {
    position: fixed; top: 0; right: 0;
    width: 460px; max-width: 95vw; height: 100vh;
    background: var(--panel);
    box-shadow: -16px 0 48px rgba(0,0,0,.15);
    transform: translateX(100%);
    transition: transform .28s var(--ease);
    z-index: 30; display: flex; flex-direction: column; overflow: hidden;
  }
  .drawer.open { transform: translateX(0); }

  .dhead {
    padding: 20px 20px 16px; border-bottom: 1px solid var(--line);
    position: relative; display: flex; flex-direction: column; gap: 4px;
  }
  .close-btn {
    position: absolute; top: 12px; right: 12px;
    border: none; background: #ece8df; border-radius: 10px;
    width: 44px; height: 44px; min-width: 44px; min-height: 44px;
    cursor: pointer; color: var(--muted);
    display: grid; place-items: center;
    transition: background 150ms var(--ease), color 150ms var(--ease);
  }
  .close-btn:hover { background: #ddd9cf; color: var(--ink); }

  .drawer h2 { font-size: 20px; font-weight: 700; padding-right: 58px; line-height: 1.2; }
  .dtype { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--accent); font-weight: 600; }

  .dbody { flex: 1; overflow-y: auto; padding: 20px 20px 52px; }
  .dbody::-webkit-scrollbar { width: 4px; }
  .dbody::-webkit-scrollbar-track { background: transparent; }
  .dbody::-webkit-scrollbar-thumb { background: var(--line); border-radius: 99px; }

  .facts { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .fact {
    background: #fff; border: 1.5px solid var(--line); border-radius: var(--radius);
    padding: 10px 14px; font-size: 12.5px; flex: 1; min-width: 80px; text-align: center;
  }
  .fact b { display: block; font-size: 19px; font-weight: 700; margin-top: 2px; line-height: 1.2; }

  .daddr { color: var(--muted); font-size: 13px; line-height: 1.5; }

  .sec { margin-top: 26px; }
  .sec h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; font-weight: 600; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; font-weight: 500; color: var(--ink); }

  textarea {
    width: 100%; border: 1.5px solid var(--line); border-radius: var(--radius);
    padding: 10px 12px; font: inherit; font-size: 13.5px; background: #fff;
    resize: vertical; color: var(--ink); line-height: 1.5;
    transition: border-color 180ms var(--ease), box-shadow 180ms var(--ease);
  }
  textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea::placeholder { color: var(--muted); }
  .note-area { min-height: 88px; }

  .savednote {
    background: var(--accent-soft); color: var(--accent);
    border-radius: 8px; padding: 9px 12px; font-size: 13px; font-weight: 500;
    margin-top: 8px; display: flex; align-items: center; gap: 7px;
  }

  .btn {
    background: var(--accent); color: #fff; border: none; border-radius: var(--radius);
    padding: 12px 18px; min-height: 44px; width: 100%;
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 10px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: background 180ms var(--ease), box-shadow 180ms var(--ease), transform 120ms var(--ease);
  }
  .btn:hover { background: var(--accent-hover); box-shadow: 0 4px 14px rgba(31,111,92,.28); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .55; cursor: not-allowed; transform: none; box-shadow: none; }

  .starpick { display: flex; gap: 2px; margin-bottom: 10px; }
  .starpick span {
    font-size: 28px; color: #d0cbc0; cursor: pointer;
    width: 44px; height: 44px; border-radius: 8px;
    display: grid; place-items: center;
    transition: color 120ms var(--ease), transform 120ms var(--ease);
    user-select: none;
  }
  .starpick span:hover { transform: scale(1.18); }
  .starpick .on { color: var(--star); }

  .review { border-top: 1px solid var(--line); padding: 14px 0; }
  .review:first-of-type { border-top: none; padding-top: 0; }
  .review .rhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .review .who { font-weight: 600; font-size: 13.5px; }
  .review .rstars { color: var(--star); font-size: 13px; letter-spacing: 1px; }
  .review p { font-size: 13.5px; color: #3a4744; margin-top: 6px; line-height: 1.6; }

  .empty { color: var(--muted); font-size: 13.5px; font-style: italic; padding: 4px 0; }

  .scrim {
    position: fixed; inset: 0;
    background: rgba(10,20,18,.42);
    opacity: 0; pointer-events: none;
    transition: opacity .28s var(--ease);
    z-index: 25; backdrop-filter: blur(1px);
  }
  .scrim.show { opacity: 1; pointer-events: auto; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="panel" role="complementary" aria-label="Building list and filters">
    <header class="brand">
      <div class="logo">
        <div class="mark" aria-hidden="true"><svg width="28" height="38" viewBox="0 0 120 160" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M60 0C33.49 0 12 21.49 12 48C12 76.5 60 140 60 140C60 140 108 76.5 108 48C108 21.49 86.51 0 60 0Z" fill="#1f6f5c"/><circle cx="60" cy="42" r="24" fill="#ffffff"/><rect x="44" y="30" width="14" height="24" rx="1" fill="#1f6f5c" opacity="0.9"/><rect x="62" y="30" width="14" height="24" rx="1" fill="#1f6f5c" opacity="0.9"/><path d="M60 34L54 40L66 40Z" fill="#ffffff"/><path d="M60 50L66 44L54 44Z" fill="#ffffff"/></svg></div>
        <h1>LiftSpot</h1>
      </div>
      <div class="tag">Find and rate elevators in buildings across Long Island</div>
    </header>
    <div class="filters">
      <div class="search" id="searchWrap">
        <svg class="s-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
        <input id="q" type="search" placeholder="Search building or town…" aria-label="Search buildings" autocomplete="off" />
        <button class="clear-btn" id="clearSearch" aria-label="Clear search">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1l8 8M9 1l-8 8"/></svg>
        </button>
      </div>
      <div class="row" id="typeChips" role="group" aria-label="Filter by building type"></div>
      <div class="range-row">
        <div class="range-header">
          <label for="storyRange"><span id="storyMode">Min.</span> stories: <span id="storyVal">any</span></label>
          <button class="exact-toggle" id="exactToggle" type="button" aria-pressed="false">Exact</button>
        </div>
        <input type="range" id="storyRange" min="0" max="40" value="0" step="1" />
      </div>
      <button class="locbtn" id="locBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        Use my location
      </button>
    </div>
    <div class="list" id="list" role="list" aria-label="Buildings"></div>
  </aside>
  <div id="map" role="region" aria-label="Map"></div>
</div>

<div class="scrim" id="scrim" aria-hidden="true"></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true">
  <div class="dhead">
    <button class="close-btn" id="closeDrawer" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 2l12 12M14 2L2 14"/></svg>
    </button>
    <h2 id="drawerTitle"></h2>
    <div class="dtype" id="dType"></div>
  </div>
  <div class="dbody" id="dBody"></div>
</div>

<script>
const { createClient } = supabase;
const sb = createClient(
  'https://qrphiipxqvsrnenkphhr.supabase.co',
  'sb_publishable_SceOqu60uTDQpX_SM62gAQ_Rl5TgZig'
);

const TYPES = ["Medical","Office","Mall","Hotel","Education","Government","Residential","Library","Transit","Legal","Entertainment","Community","Financial"];
const TYPE_ICON  = {Medical:"✚", Office:"▣", Mall:"◫", Hotel:"⌂", Education:"✎", Government:"⚑", Residential:"⌂", Library:"▦", Transit:"⬡", Legal:"⚖", Entertainment:"♦", Community:"◉", Financial:"$"};
const TYPE_COLOR = {Medical:"#c0392b", Office:"#2471a3", Mall:"#7d3c98", Hotel:"#c87722", Education:"#1f6f5c", Government:"#5d6d7e", Residential:"#e8590c", Library:"#0097a7", Transit:"#455a64", Legal:"#7d5a00", Entertainment:"#e53935", Community:"#00897b", Financial:"#1a6b3c"};

let BUILDINGS = [];
let state = { q:"", types:new Set(), minStories:0, exactStories:false, userLoc:null, activeId:null };

const stars = n => "★".repeat(Math.round(n)) + "☆".repeat(5-Math.round(n));
const dist = (a,b) => {
  const R=3959,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
};

/* Map */
const map = new maplibregl.Map({
  container:'map',
  style:'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
  center:[-73.55,40.78], zoom:9.6
});
map.addControl(new maplibregl.NavigationControl(),'top-right');

/* Filtering */
function filtered(){
  return BUILDINGS.filter(b=>{
    if(state.q){ const q=state.q.toLowerCase(); if(!(b.name.toLowerCase().includes(q)||b.town.toLowerCase().includes(q)||b.addr.toLowerCase().includes(q))) return false; }
    if(state.types.size && !state.types.has(b.type)) return false;
    if(state.minStories > 0){
      if(state.exactStories){ if(b.stories !== state.minStories) return false; }
      else { if(b.stories < state.minStories) return false; }
    }
    return true;
  }).map(b=>({...b, _d: state.userLoc?dist(state.userLoc,b):null}))
    .sort((a,b)=> state.userLoc ? a._d-b._d : b.rating-a.rating);
}

/* Skeleton loader */
function skeletons(n=5){
  return Array.from({length:n},()=>`
    <div class="skeleton-card" aria-hidden="true">
      <div class="skel skel-title"></div>
      <div class="skel skel-sub"></div>
      <div class="skel skel-addr"></div>
      <div class="skel-row"><div class="skel skel-badge"></div><div class="skel skel-badge"></div></div>
    </div>`).join('');
}

/* Render list */
function renderList(){
  const items = filtered();
  const list = document.getElementById('list');
  list.innerHTML = `<div class="count">${items.length} building${items.length!==1?'s':''}${state.userLoc?' · nearest first':' · top rated first'}</div>`;
  if(!items.length){
    list.innerHTML += '<div class="empty" style="padding:16px 4px">No buildings match your filters.</div>';
  }
  items.forEach(b=>{
    const el=document.createElement('div');
    el.className='card'+(b.id===state.activeId?' active':'');
    el.setAttribute('role','listitem');
    el.setAttribute('tabindex','0');
    el.setAttribute('aria-label',`${b.name}, ${b.type}, ${b.stories} stories, rated ${b.rating}`);
    el.innerHTML=`
      <div class="top">
        <div style="min-width:0">
          <h3>${b.name}</h3>
          <div class="type" style="color:${TYPE_COLOR[b.type]||'var(--accent)'}">⬤ ${b.type}</div>
        </div>
        <div class="stars" aria-label="Rating ${b.rating} out of 5">${stars(b.rating)}<span class="n">${b.rating}</span></div>
      </div>
      <div class="addr">${b.addr}</div>
      <div class="meta">
        <span class="badge">${b.stories} stories</span>
        <span class="badge">${b.elevators} elevators</span>
        ${b._d!=null?`<span class="dist">${b._d.toFixed(1)} mi away</span>`:''}
      </div>`;
    const activate = () => { openBuilding(b.id); map.flyTo({center:[b.lng,b.lat],zoom:14}); };
    el.onclick = activate;
    el.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); activate(); } };
    list.appendChild(el);
  });
  renderMarkers(items);
}

function makePinImage(fill){
  const s=2, w=32*s, h=42*s;
  const c=document.createElement('canvas');
  c.width=w; c.height=h;
  const ctx=c.getContext('2d');
  ctx.scale(s,s);

  const cx=16, cy=13, r=12;

  // Needle shadow
  ctx.fillStyle='rgba(0,0,0,0.18)';
  ctx.beginPath();
  ctx.moveTo(cx-2.5, cy+r);
  ctx.lineTo(cx+2.5, cy+r);
  ctx.lineTo(cx+1, 42);
  ctx.lineTo(cx-1, 42);
  ctx.closePath();
  ctx.fill();

  // Needle
  ctx.fillStyle='rgba(15,15,15,0.72)';
  ctx.beginPath();
  ctx.moveTo(cx-1.8, cy+r-0.5);
  ctx.lineTo(cx+1.8, cy+r-0.5);
  ctx.lineTo(cx, 41);
  ctx.closePath();
  ctx.fill();

  // Head drop-shadow
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.22)';
  ctx.shadowBlur=6*s;
  ctx.shadowOffsetY=2*s;
  ctx.fillStyle=fill;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // Head base colour
  ctx.fillStyle=fill;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fill();

  // Gloss highlight (top-left radial)
  const g=ctx.createRadialGradient(cx-4, cy-4, 1, cx, cy, r);
  g.addColorStop(0,'rgba(255,255,255,0.48)');
  g.addColorStop(0.55,'rgba(255,255,255,0.08)');
  g.addColorStop(1,'rgba(0,0,0,0.04)');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fill();

  // Thin border ring
  ctx.strokeStyle='rgba(0,0,0,0.14)';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.stroke();

  const d=ctx.getImageData(0,0,w,h);
  return {width:w, height:h, data:d.data};
}

function renderMarkers(items){
  const src=map.getSource('buildings-src');
  if(!src) return;
  src.setData({
    type:'FeatureCollection',
    features:items.map(b=>({
      type:'Feature',
      geometry:{type:'Point',coordinates:[b.lng,b.lat]},
      properties:{id:b.id, active:b.id===state.activeId}
    }))
  });
}

/* Load from Supabase */
async function loadBuildings(){
  document.getElementById('list').innerHTML = '<div class="count">Loading…</div>' + skeletons();
  const { data, error } = await sb.from('buildings').select('*');
  if(error){
    document.getElementById('list').innerHTML = '<div class="empty" style="padding:16px 4px">Failed to load. Please refresh.</div>';
    console.error(error);
    return;
  }
  BUILDINGS = data;
  renderList();
}

/* Detail drawer */
async function openBuilding(id){
  state.activeId=id; renderList();
  const b=BUILDINGS.find(x=>x.id===id);
  document.getElementById('drawerTitle').textContent=b.name;
  document.getElementById('dType').textContent=b.type+" · "+b.town;
  const body=document.getElementById('dBody');
  const savedNote=localStorage.getItem(`liftspot_note_${id}`)||'';
  body.innerHTML=`
    <div class="facts">
      <div class="fact">Stories<b>${b.stories}</b></div>
      <div class="fact">Elevators<b>${b.elevators}</b></div>
      <div class="fact">Rating<b>${b.rating} ★</b></div>
    </div>
    <div class="daddr">${b.addr}</div>

    <div class="sec">
      <h4>My private notes</h4>
      <div class="field">
        <label for="noteBox">Notes (saved to this device only)</label>
        <textarea class="note-area" id="noteBox" placeholder="e.g. Otis Gen2, glass back, north entrance…">${savedNote}</textarea>
      </div>
      <button class="btn" id="saveNote">Save note</button>
      <div id="noteSaved"></div>
    </div>

    <div class="sec">
      <h4>Leave a review</h4>
      <div role="group" aria-label="Star rating">
        <div class="starpick" id="picker">${[1,2,3,4,5].map(n=>`<span data-n="${n}" role="radio" aria-label="${n} star${n>1?'s':''}" tabindex="0">★</span>`).join('')}</div>
      </div>
      <div class="field">
        <label for="rvText">Your review</label>
        <textarea id="rvText" placeholder="What are the elevators like here?" style="min-height:80px"></textarea>
      </div>
      <button class="btn" id="postReview">Post review</button>
    </div>

    <div class="sec">
      <h4>Reviews</h4>
      <div id="rvList"><div class="empty">Loading…</div></div>
    </div>`;

  showDrawer(true);
  document.getElementById('closeDrawer').focus();

  document.getElementById('saveNote').onclick=()=>{
    localStorage.setItem(`liftspot_note_${id}`, document.getElementById('noteBox').value);
    document.getElementById('noteSaved').innerHTML=`<div class="savednote">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
      Saved to this device
    </div>`;
  };

  let pick=0;
  const picker=document.getElementById('picker');
  const updatePicker=val=>{
    pick=val;
    picker.querySelectorAll('span').forEach(x=>x.classList.toggle('on',+x.dataset.n<=pick));
  };
  picker.querySelectorAll('span').forEach(s=>{
    s.onclick=()=>updatePicker(+s.dataset.n);
    s.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); updatePicker(+s.dataset.n); } };
  });

  document.getElementById('postReview').onclick=async()=>{
    const t=document.getElementById('rvText').value.trim();
    if(!pick){ alert('Please pick a star rating first.'); return; }
    const btn=document.getElementById('postReview');
    btn.disabled=true; btn.textContent='Posting…';
    const { error }=await sb.from('reviews').insert({building_id:id, who:'You', stars:pick, body:t||'(no comment)'});
    if(error){ alert('Error: '+error.message); btn.disabled=false; btn.textContent='Post review'; return; }
    await refreshReviews(id);
  };

  await refreshReviews(id);
}

async function refreshReviews(id){
  const { data: reviews, error }=await sb.from('reviews').select('*').eq('building_id',id).order('created_at',{ascending:false});
  if(error){ const el=document.getElementById('rvList'); if(el) el.innerHTML='<div class="empty">Error loading reviews.</div>'; return; }
  const b=BUILDINGS.find(x=>x.id===id);
  b.reviews=reviews||[];
  if(b.reviews.length){
    const newRating=+(b.reviews.reduce((s,r)=>s+r.stars,0)/b.reviews.length).toFixed(1);
    if(newRating!==b.rating){
      b.rating=newRating;
      await sb.from('buildings').update({rating:newRating}).eq('id',id);
    }
  }
  const rvList=document.getElementById('rvList');
  if(rvList) rvList.innerHTML=renderReviews(b);
  const rvText=document.getElementById('rvText');
  const btn=document.getElementById('postReview');
  if(rvText) rvText.value='';
  if(btn){ btn.disabled=false; btn.textContent='Post review'; }
}

function renderReviews(b){
  if(!b.reviews||!b.reviews.length) return '<div class="empty">No reviews yet — be the first.</div>';
  return b.reviews.map(r=>`<div class="review"><div class="rhead"><span class="who">${r.who}</span><span class="rstars" aria-label="${r.stars} stars">${stars(r.stars)}</span></div><p>${r.body||''}</p></div>`).join('');
}

function showDrawer(open){
  const drawer=document.getElementById('drawer');
  const scrim=document.getElementById('scrim');
  drawer.classList.toggle('open',open);
  drawer.setAttribute('aria-hidden',String(!open));
  scrim.classList.toggle('show',open);
  if(!open){ state.activeId=null; renderList(); }
}
document.getElementById('closeDrawer').onclick=()=>showDrawer(false);
document.getElementById('scrim').onclick=()=>showDrawer(false);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') showDrawer(false); });

/* Filter controls */
const typeChips=document.getElementById('typeChips');
TYPES.forEach(t=>{
  const c=document.createElement('button');
  c.className='chip'; c.type='button';
  c.setAttribute('aria-pressed','false');
  c.textContent=t;
  c.onclick=()=>{
    const on=c.classList.toggle('on');
    c.setAttribute('aria-pressed',String(on));
    on?state.types.add(t):state.types.delete(t);
    renderList();
  };
  typeChips.appendChild(c);
});

const qInput=document.getElementById('q');
const searchWrap=document.getElementById('searchWrap');
qInput.oninput=e=>{
  state.q=e.target.value;
  searchWrap.classList.toggle('has-value',!!state.q);
  renderList();
};
document.getElementById('clearSearch').onclick=()=>{
  qInput.value=''; state.q='';
  searchWrap.classList.remove('has-value');
  qInput.focus(); renderList();
};

const range=document.getElementById('storyRange');
const storyVal=document.getElementById('storyVal');
const storyMode=document.getElementById('storyMode');
const exactToggle=document.getElementById('exactToggle');

function updateStoryLabel(){
  if(state.minStories===0){ storyVal.textContent='any'; return; }
  storyVal.textContent = state.exactStories ? String(state.minStories) : state.minStories+'+';
}

range.oninput=e=>{
  state.minStories=+e.target.value;
  updateStoryLabel();
  renderList();
};

exactToggle.onclick=()=>{
  state.exactStories=!state.exactStories;
  exactToggle.classList.toggle('on', state.exactStories);
  exactToggle.setAttribute('aria-pressed', String(state.exactStories));
  storyMode.textContent = state.exactStories ? 'Exact' : 'Min.';
  updateStoryLabel();
  renderList();
};

document.getElementById('locBtn').onclick=()=>{
  if(!navigator.geolocation){ alert('Geolocation not supported'); return; }
  navigator.geolocation.getCurrentPosition(p=>{
    state.userLoc={lat:p.coords.latitude,lng:p.coords.longitude};
    new maplibregl.Marker({color:'#0e3d32'}).setLngLat([state.userLoc.lng,state.userLoc.lat]).addTo(map);
    map.flyTo({center:[state.userLoc.lng,state.userLoc.lat],zoom:11});
    renderList();
  },()=>alert('Could not get your location'));
};

map.on('load', () => {
  map.addImage('pin',        makePinImage('#1f6f5c'), {pixelRatio:2});
  map.addImage('pin-active', makePinImage('#0e3d32'), {pixelRatio:2});
  map.addSource('buildings-src', {type:'geojson', data:{type:'FeatureCollection',features:[]}});
  map.addLayer({
    id:'buildings-pins', type:'symbol', source:'buildings-src',
    layout:{
      'icon-image':['case',['==',['get','active'],true],'pin-active','pin'],
      'icon-anchor':'bottom',
      'icon-allow-overlap':true,
      'icon-size':1
    }
  });
  map.on('click','buildings-pins', e=>{
    if(!e.features.length) return;
    const id=e.features[0].properties.id;
    const b=BUILDINGS.find(x=>x.id===id);
    if(b){ openBuilding(id); map.flyTo({center:[b.lng,b.lat],zoom:14}); }
  });
  map.on('mouseenter','buildings-pins',()=>{ map.getCanvas().style.cursor='pointer'; });
  map.on('mouseleave','buildings-pins',()=>{ map.getCanvas().style.cursor=''; });
  if(BUILDINGS.length) renderMarkers(filtered());
});

loadBuildings();
</script>
</body>
</html>
